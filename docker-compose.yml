# Postgres для разработки; runtime — backend, Caddy и ежедневные бэкапы.
services:
  caddy:
    profiles: [runtime]
    image: ${DOCKERHUB_USER:-stamplevskiyd}/grocerylist-caddy:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: caddy.Dockerfile
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8080}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-8443}
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-8080}:${CADDY_HTTP_PORT:-8080}"
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:${CADDY_HTTPS_PORT:-8443}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    profiles: [runtime]
    image: ${DOCKERHUB_USER:-stamplevskiyd}/grocerylist-backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        APP_VERSION: ${IMAGE_TAG:-dev}
    env_file: .env
    environment:
      DB_URL: ${CONTAINER_DB_URL:-postgresql+asyncpg://grocery:grocery@postgres:5432/grocery}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  backup:
    profiles: [runtime]
    image: postgres:18-alpine
    entrypoint: [/bin/sh, /scripts/pg_backup.sh]
    command: [--loop]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-grocery}
      PGPASSWORD: ${POSTGRES_PASSWORD:-grocery}
      PGDATABASE: ${POSTGRES_DB:-grocery}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/pg_backup.sh:/scripts/pg_backup.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocery}
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
    ports:
      # Только localhost: наружу Postgres не публикуется (спец. §9). Порт на машине
      # разработчика меняется через POSTGRES_PORT, если 5432 занят.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 хранит данные в подкаталоге версии внутри /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-grocery}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  postgres-backups:
