name: Images

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, caddy]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image tags
        id: tags
        shell: bash
        run: |
          printf 'sha=%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            source scripts/release_lib.sh
            validate_release_tag "$GITHUB_REF_NAME"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/grocerylist-${{ matrix.component }}:${{ steps.tags.outputs.sha }}
          build-args: APP_VERSION=${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      # A release gets its own baked APP_VERSION; its SHA image remains deployable by SHA.
      - name: Build and push release image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/grocerylist-${{ matrix.component }}:${{ github.ref_name }}
          build-args: APP_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
