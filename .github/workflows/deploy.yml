name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag: 12-character commit SHA or v1.2.3'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: grocerylist-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deploy release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/opt/grocerylist' }}
        run: scripts/deploy.sh "$RELEASE_TAG"
