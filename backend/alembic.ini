[alembic]
# Миграции лежат в пакете (как в Superset) и находятся через ресурс пакета —
# работает и из установленного пакета в Docker-образе.
script_location = grocery:migrations
# Имя файла миграции начинается с даты: 2026_09_29_1200-0001_create_users.py (ADR-0013).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC
# URL не задаётся здесь: env.py берёт его из настроек (DB_URL), тесты подставляют свой.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
