<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — тёмная тема</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Onest:wght@400;500;600&display=swap">
<style>
body{margin:0}
.gl-light{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F2F2F4;--ink:#1C1C1E;--ink-2:#5B5B60;--ink-3:#6E6E73;--line:#E5E5EA;--accent:#9C6500;--accent-fill:#FFCC00;--accent-soft:#FFF6D1;--on-accent:#1C1C1E;--ai:#5856D6;--ai-soft:#EEEEFB;--danger:#C4291C;--danger-soft:#FDE7E5;--on-danger:#FFFFFF;--fresh:#FFF0A8;--scrim:rgba(0,0,0,.35);--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.12)}
.gl-dark{--bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--ink:#F2F2F7;--ink-2:#AEAEB2;--ink-3:#98989D;--line:#38383A;--accent:#FFD60A;--accent-fill:#FFD60A;--accent-soft:#332B00;--on-accent:#1C1C1E;--ai:#A5A4FF;--ai-soft:#25244A;--danger:#FF6961;--danger-soft:#3A1A18;--on-danger:#1C1C1E;--fresh:#3D3510;--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5)}
a{color:var(--accent)}a:hover{color:var(--ink)}
input::placeholder{color:var(--ink-3)}
</style>
</helmet>
<div class="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 112px 24px 36px; background: var(--bg); color: var(--ink); font-family: Onest, system-ui, sans-serif">

<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px">
<span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: var(--accent-fill); color: var(--on-accent)">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9h15l-1.3 10.2a2 2 0 0 1-2 1.8H7.8a2 2 0 0 1-2-1.8z"></path><path d="M9 9V7a3 3 0 0 1 6 0v2"></path><path d="M9.5 14l2 2 3.5-3.5"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: -0.01em">GroceryList</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: var(--ink-2)">Список покупок, который пополняет ваш ассистент</p>
</div>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin-top: 40px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: var(--ink-2)">Логин</span>
<input value="[логин]" autocomplete="username" autocapitalize="none" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-family: inherit; font-size: 17px; color: var(--ink)">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: var(--ink-2)">Пароль</span>
<input type="password" value="неверный" autocomplete="current-password" aria-invalid="true" aria-describedby="login-error" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid var(--danger); border-radius: 14px; background: var(--surface); font-family: inherit; font-size: 17px; color: var(--ink)">
</label>
<div id="login-error" role="alert" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-size: 14px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5M12 16h.01"></path></svg>
Неверный логин или пароль</div>
<a href="ByTagsDark.dc.html" style="height: 54px; margin-top: 8px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--accent-fill); color: var(--on-accent); font-size: 17px; font-weight: 600; text-decoration: none">Войти</a>
</form>

<p style="margin: auto 0 0; text-align: center; font-size: 13px; line-height: 1.45; color: var(--ink-3)">Регистрации нет — аккаунт создаёт администратор сервера.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? true) ? 'gl-dark' : 'gl-light' };
  }
}
</script>
</body>
</html>
