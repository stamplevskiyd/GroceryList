<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFCC00" />
    <meta name="description" content="GroceryList — список покупок для вас и вашего ассистента." />
    <title>GroceryList — покупки под рукой</title>
    <link rel="stylesheet" href="/src/styles/landing.css" />
  </head>
  <body>
    <main id="landing">
      <header><span class="brand-mark" aria-hidden="true">✓</span> GroceryList</header>
      <p role="status">Загружаем покупки…</p>
      <noscript>Для работы со списком включите JavaScript в браузере.</noscript>
    </main>
    <div id="app-root"></div>
    <template id="consent-template">
      <main class="consent">
        <header><span class="brand-mark" aria-hidden="true">✓</span> GroceryList</header>
        <h1>Подключение ассистента</h1>
        <p id="consent-status" role="status" aria-live="polite">Проверяем запрос…</p>
        <form id="login-form" hidden>
          <h2>Войдите в GroceryList</h2>
          <label>Логин<input id="username" name="username" autocomplete="username" required maxlength="64" /></label>
          <label>Пароль<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
          <button id="sign-in" class="primary" type="submit">Войти</button>
          <p class="muted">Нет аккаунта? <a id="consent-register" href="/?register=1">Зарегистрироваться</a></p>
        </form>
        <form id="decision-form" hidden>
          <h2><span id="client-name"></span> запрашивает доступ</h2>
          <p>Вы вошли как <strong id="signed-in-user"></strong>.</p>
          <p>Ассистент сможет читать и изменять ваши списки покупок, включая удаление позиций.</p>
          <p id="offline-notice" class="muted" hidden>Доступ сохранится после закрытия страницы. Его можно отозвать.</p>
          <div class="callback"><strong>Возврат на <span id="redirect-host"></span></strong><p id="redirect-address"></p></div>
          <p id="loopback-notice" class="warning" hidden>Это приложение на вашем компьютере. Разрешайте доступ, только если вы сами начали его подключение.</p>
          <p class="muted">Подтверждайте только то подключение, которое начали сами.</p>
          <div class="actions">
            <button id="deny-access" type="submit" value="deny">Отклонить</button>
            <button class="primary" type="submit" value="allow">Разрешить доступ</button>
          </div>
        </form>
      </main>
    </template>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
